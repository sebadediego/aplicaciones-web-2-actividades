<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Registro de Usuario</title>
        <style>
            body {
                background: #f5f6fa;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
            }
            form {
                background: #fff;
                padding: 2rem 2.5rem;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
                min-width: 300px;
            }
            label {
                font-weight: 500;
                margin-bottom: 0.2rem;
            }
            input[type='text'],
            input[type='password'] {
                width: 100%;
                padding: 0.5rem;
                border: 1px solid #ccc;
                border-radius: 4px;
                margin-top: 0.25rem;
                font-size: 1rem;
            }
            button[type='submit'] {
                background: #1ca13b;
                color: #fff;
                border: none;
                padding: 0.7rem;
                border-radius: 4px;
                font-size: 1rem;
                cursor: pointer;
                transition: background 0.2s;
            }
            button[type='submit']:hover {
                background: #21bb45;
            }
        </style>
    </head>
    <body>
        <form id="registro-form" action="/registrar" method="post">
            <label for="usuario">
                Usuario:
                <br />
                <input
                    type="text"
                    id="usuario"
                    name="usuario" maxlength="150"
                    required
                />
            </label>
            <br />
            <label for="pass">
                Password:
                <br />
                <input
                    type="password"
                    id="pass"
                    name="pass" minlength="8"
                    required
                />
            </label>
            <br />
            <button type="submit">Registrar</button>
            <br />
            <a href="./index.html">Login</a>
        <p id="mensaje" role="status"></p></form><script src="/login/mensajes.js" defer></script>

    </body>
</html>
